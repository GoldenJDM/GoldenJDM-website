<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لینک‌های پروفایل | GoldenJDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
    <style>
        :root {
            --bg: #000000;
            --surface: #0e0e11;
            --surface-2: #16161b;
            --line: rgba(255, 255, 255, 0.10);
            --text: #f2f2f4;
            --muted: #8b8b95;
            --tile: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- پاپ‌آپ هشدار ---------- */
        .alert-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.35);
            z-index: 1000;
            animation: slideDown 0.5s ease-out;
        }

        .alert-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .alert-text {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .alert-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            animation: pulse 2s infinite;
        }

        .alert-icon svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: currentColor;
        }

        .alert-message {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.7;
        }

        .alert-message .domain {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
            margin: 0 4px;
            direction: ltr;
        }

        .close-alert {
            flex-shrink: 0;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .close-alert:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* ---------- بدنه صفحه ---------- */
        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 1rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        /* ---------- کارت لینک ---------- */
        .link-card {
            --brand: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 22px 14px 18px;
            text-decoration: none;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            transition: transform 0.18s ease, border-color 0.18s ease,
                        background 0.18s ease, box-shadow 0.18s ease;
        }

        /* کاشی سفید پشت لوگو — تا لوگوی رنگی هر برنامه روی آن دیده شود */
        .link-card .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            background: var(--tile);
            border-radius: 16px;
            overflow: hidden;
            transition: box-shadow 0.18s ease;
        }

        .link-card .logo img {
            width: 68%;
            height: 68%;
            object-fit: contain;
            display: block;
        }

        .link-card .label {
            font-size: 0.95rem;
            font-weight: 500;
            direction: ltr;
        }

        .link-card:hover,
        .link-card:focus-visible {
            transform: translateY(-4px);
            background: var(--surface-2);
            border-color: var(--brand);
            box-shadow: 0 14px 30px -14px var(--brand);
            outline: none;
        }

        .link-card:focus-visible .logo {
            box-shadow: 0 0 0 3px var(--brand);
        }

        /* ---------- رنگ اختصاصی هر برند ---------- */
        .mastodon  { --brand: #6364ff; }
        .telegram  { --brand: #29a9eb; }
        .tiktok    { --brand: #ff0050; }
        .rubika    { --brand: #ff5c39; }
        .bale      { --brand: #37b24d; }
        .eitaa     { --brand: #ff9800; }
        .pinterest { --brand: #e60023; }
        .vk        { --brand: #0077ff; }
        .signal    { --brand: #3a76f0; }
        .bluesky   { --brand: #0a7aff; }
        .mydot     { --brand: #00c2a8; }
        .x         { --brand: #71767b; }

        /* ---------- انیمیشن‌ها ---------- */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(0);     opacity: 1; }
            to   { transform: translateY(-100%); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);    opacity: 1;   }
            50%      { transform: scale(1.12); opacity: 0.75; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 700px) {
            .alert-content { flex-direction: column; align-items: flex-start; gap: 14px; }
            .close-alert { align-self: flex-end; }
            .alert-message { font-size: 0.92rem; }
        }

        @media (max-width: 480px) {
            .links-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .link-card { padding: 18px 10px 14px; }
        }
    </style>
</head>
<body>
    <!-- پاپ‌آپ هشدار -->
    <div class="alert-popup" id="alertPopup">
        <div class="alert-content">
            <div class="alert-text">
                <div class="alert-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 1 21h22L12 2zm0 5.5 7.5 12.5h-15L12 7.5zM11 10v5h2v-5h-2zm0 6.5V18h2v-1.5h-2z"/>
                    </svg>
                </div>
                <div class="alert-message">
                    برای صحت لینک پروفایل‌ها حتماً به دامنه <span class="domain">GoldenJDM.ir/profiles</span> دقت کنید
                </div>
            </div>
            <button class="close-alert" onclick="closeAlert()">بستن</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>لینک‌های پروفایل</h1>
            <p>شبکه‌های اجتماعی من را دنبال کنید</p>
        </div>

            برای اضافه کردن یا عوض کردن لوگو، فایل SVG را در پوشه profiles/ بگذار
            و فقط مسیر src همان کارت را عوض کن.
        -->
        <div class="links-grid">
            <a href="https://mastodon.social/@GoldenJDM" class="link-card mastodon" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/mastodon.svg" alt="Mastodon"></span>
                <span class="label">Mastodon</span>
            </a>

            <a href="https://t.me/GoldenJDM" class="link-card telegram" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/telegram.svg" alt="Telegram"></span>
                <span class="label">Telegram</span>
            </a>

            <a href="https://tiktok.com/@GoldenJDM.ir" class="link-card tiktok" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/tiktok.svg" alt="TikTok"></span>
                <span class="label">TikTok</span>
            </a>

            <a href="https://rubika.ir/GoldenJDM" class="link-card rubika" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/rubika.svg" alt="Rubika"></span>
                <span class="label">Rubika</span>
            </a>

            <a href="https://bale.ai/Goldenjdm" class="link-card bale" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/bale.svg" alt="Bale"></span>
                <span class="label">Bale</span>
            </a>

            <a href="https://eitaa.com/gldenjdm" class="link-card eitaa" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/eitaa.svg" alt="Eitaa"></span>
                <span class="label">Eitaa</span>
            </a>

            <a href="https://pinterest.com/GoldenJDM_ir" class="link-card pinterest" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/pinterest-logo.svg" alt="Pinterest"></span>
                <span class="label">Pinterest</span>
            </a>

            <a href="https://vk.com/goldenjdm" class="link-card vk" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/vk.svg" alt="VK"></span>
                <span class="label">VK</span>
            </a>

            <a href="https://signal.me/#eu/h5Vd6Q_rSvRXZn9idz0sOrrB4T1B5tq-ohrFvIKiAlfYLDC-vmpEFYbwnkwe_tb0" class="link-card signal" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/signal.svg" alt="Signal"></span>
                <span class="label">Signal</span>
            </a>

            <a href="https://bsky.app/profile/goldenjdm.ir" class="link-card bluesky" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/bluesky.svg" alt="Bluesky"></span>
                <span class="label">Bluesky</span>
            </a>

            <a href="https://mydot.one/profile/GoldenJDM" class="link-card mydot" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/MyDot.svg" alt="MyDot"></span>
                <span class="label">MyDot</span>
            </a>

            <a href="https://x.com/GoldenJDM_ir" class="link-card x" target="_blank" rel="noopener">
                <span class="logo"><img src="https://raw.githubusercontent.com/GoldenJDM/GoldenJDM-website/refs/heads/main/profiles/x.svg" alt="X"></span>
                <span class="label">X</span>
            </a>
        </div>
    </div>

    <script>
        function closeAlert() {
            const alertPopup = document.getElementById('alertPopup');
            alertPopup.style.animation = 'slideUp 0.3s ease-in';
            setTimeout(() => {
                alertPopup.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
